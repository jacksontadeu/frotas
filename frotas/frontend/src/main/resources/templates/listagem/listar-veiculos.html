<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listagem de Veículos - Novo Triunfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/tema/tema.css">
    <style>
        body {
            background-color: #121212; /* preto suave */
            color: #e0e0e0; /* cinza claro para texto */
        }
        .list-group-item {
            background-color: #1e1e1e; /* cinza escuro */
            border: 1px solid #333;
            color: #e0e0e0;
            border-radius: 10px;
        }
        .btn {
            border-radius: 20px; /* arredondado */
            padding: 8px 16px;   /* maior */
            font-size: 0.9rem;
        }
        .btn-info {
            background-color: #17a2b8;
            border: none;
        }
        .btn-warning {
            background-color: #ffc107;
            border: none;
            color: #000;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        header.bg-dark {
            background-color: #000 !important;
        }
    </style>
</head>
<body>
<header id="header">
    <div th:insert="fragments/header :: cabecalho-principal"></div>
    <button class="btn btn-secondary position-fixed top-0 end-0 m-3" onclick="toggleTheme()">Alternar Tema</button>
</header>

<header class="bg-dark text-white p-3 mb-4">
    <h2 class="text-center">🚗 Listagem de Veículos</h2>
</header>

<div class="container">
    <ul class="list-group">
        <li th:each="veiculo : ${veiculos}" class="list-group-item shadow-sm mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5 th:text="${veiculo.nome}" class="mb-1"></h5>
                    <p class="mb-1">
                        <strong>Placa:</strong> <span th:text="${veiculo.placaVeiculo}"></span> |
                        <strong>Frota:</strong> <span th:text="${veiculo.frota}"></span> |
                        <strong>Cor:</strong> <span th:text="${veiculo.cor}"></span> |
                        <strong>Ano:</strong> <span th:text="${veiculo.anoDeFabricacao}"></span> |
                        <strong>Tipo:</strong> <span th:text="${veiculo.tipoVeiculo}"></span> |
                        <strong>Base:</strong> <span th:text="${veiculo.base.nome}"></span>
                    </p>
                </div>
                <div>
                    <a th:href="@{/veiculo/visualizar/{id}(id=${veiculo.id})}"
                       class="btn btn-success me-2">Visualizar</a>
                    <a th:href="@{/veiculo/editar/{id}(id=${veiculo.id})}"
                       class="btn btn-light me-2">Alterar</a>
                    <a th:href="@{/veiculo/excluir/{id}(id=${veiculo.id})}"
                       class="btn btn-danger"
                       onclick="return confirm('Tem certeza que deseja excluir este veículo?')">Excluir</a>
                </div>
            </div>
        </li>
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
